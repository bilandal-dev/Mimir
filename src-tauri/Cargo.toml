[package]
name = "mimir"
version = "0.1.1"
description = "Schlanke Desktop-Oberfläche für einen eigenen Ollama-Server"
# `authors` landet im `Maintainer`-Feld des Debian-Pakets. Mit dem Vorgabewert
# "you" erzeugte `cargo tauri build` ein Paket, das als Betreiber „you" führt –
# sichtbar in jeder Paketverwaltung, die es installiert.
authors = ["bilandal-dev <noreply@github.com>"]
# `license` wird von Cargo verlangt, sobald die Anwendung veröffentlicht werden
# soll. Die Angabe hier und die LICENSE-Datei im Wurzelverzeichnis müssen
# übereinstimmen.
license = "MIT"
edition = "2021"
repository = "https://github.com/bilandal-dev/Mimir"
keywords = ["ollama", "chat", "tauri"]
categories = ["gui"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mimir_lib"
# Nur `rlib`. Tauri legt hier üblicherweise `staticlib` und `cdylib` dazu, weil es
# die für iOS (staticlib) und Android (cdylib) braucht. Auf dem Desktop werden
# beide trotzdem gebaut – cargo erzeugt *jede* gelistete Form, auch wenn die Binary
# sie nie anfasst. Gemessen: ein zusätzlicher LTO-Durchlauf über den ganzen
# Crate-Graphen, 170 MB `.a`, und 3m40s von der Gesamtbauzeit.
# `cargo build --release` unter Windows und macOS baut bei Bedarf selbst die
# passende Form; auf Mobilgeräten ist die Zeile wieder zu ergänzen.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Für Ollama im LAN genügt Klartext-HTTP, für die Nextcloud-Instanz nicht: Sie
# liefert HTTPS mit einem selbstsignierten Zertifikat. Deshalb kommt ein
# TLS-Stack dazu, der ohne systemweites OpenSSL auskommt. Die Gültigkeit wird
# nicht dem System überlassen, sondern gegen das in der Konfiguration
# bestätigte Zertifikat geprüft.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
# Für den Fingerabdruck, mit dem ein selbstsigniertes Zertifikat bestätigt wird.
sha2 = "0.10"
# Die sechs Features, die benutzt werden, statt `full`:
#   rt-multi-thread  für `#[tokio::test]` und `tokio::spawn`
#   macros           für `tokio::select!`
#   time             für `timeout`, `sleep`, `interval`
#   sync             für `watch` im Stream
#   process          für den SSH-Start
#   io-util          für `AsyncReadExt` beim SSH-Start
# `full` zog zusätzlich `fs`, `io-std`, `net`, `signal` und `parking_lot` mit,
# von denen keines benutzt wird. Die Bauzeit ändert sich dadurch kaum, die Binary
# wird rund 48 KB kleiner – der Grund ist eine ehrliche Liste.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }
futures-util = "0.3"
ammonia = "4.2"
pulldown-cmark = "0.13.4"
zeroize = "1.8"
# Kalender: CalDAV antwortet mit WebDAV-Multistatus in XML, und Termine brauchen
# echte Zeitpunkte samt Zeitzone. DieICS- und RRULE-Aufbereitung ist bewusst
# selbst geschrieben, damit nur diese Abhängigkeiten dazukommen.
quick-xml = "0.42"
chrono = "0.4"
chrono-tz = "0.10"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
